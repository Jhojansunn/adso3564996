<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-Clip Path</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section{
            div.clip {
                background: url(imgs/pittsburgh.jpg) no-repeat center / cover;
                margin: 2rem auto;
                height: 240px;
                width: 240px;
                transition: all 0.5s ease;

                &.clip3 {
                    clip-path: circle(25%);

                    &:hover {
                        clip-path: circle(100%);
                    }
                }
                &.clip1 {
                    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);


                    &:hover {
                        clip-path: polygon(50% 0%, 100% 0%, 100% 36%, 100% 56%, 100% 100%, 53% 100%, 0% 100%, 0% 59%, 0% 0%, 24% 0%);

                    }
                }

                &.clip2 {
                    clip-path: polygon(10% 25%, 35% 25%, 35% 0%, 65% 0%, 65% 25%, 90% 25%, 90% 50%, 65% 50%, 65% 100%, 35% 100%, 35% 50%, 10% 50%);

                    &:hover {
                        clip-path: polygon(0% 24%, 0% 0%, 35% 0%, 65% 0%, 100% 0%, 100% 25%, 100% 50%, 100% 100%, 65% 100%, 35% 100%, 0% 100%, 0% 51%);


                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>32-Clip Path</h1>
            <img src="../src/image/logo-css.png" alt="CSS">
            <h3>Propery that creates a clipping region defining which parts of an element are visible (using shapes)</h3>
        </header>
        <section>
            <h3 class="subtitle">Example 01:</h3>
            <div class="clip clip1"></div>
            <h3 class="subtitle">Example 02:</h3>
            <div class="clip clip2"></div>
            <h3 class="subtitle">Example 03:</h3>
            <div class="clip clip3"></div>
        </section>
    </main>
</body>

</html>
