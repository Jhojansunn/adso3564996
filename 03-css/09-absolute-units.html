<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09-Absolute Units</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section ul {
            li.absolute01 {font-size: 0.4in;}
            li.absolute02 {font-size: 1cm;}
            li.absolute03 {font-size: 10mm;}
            li.absolute04 {font-size: 10pt;}
            li.absolute05 {font-size: 1pc;}
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">

    <main>
        <header class="mmenu internal">
            <h1>09-Absolute Units</h1>
            <img src="../src/image/logo-css.png" alt="CSS">
            <h3>Specify a fixed length value. It doesn't matter if the screen's width or height changes.</h3>
            <ul>
                <li>Inch (in)</li>
                <li >Centimeters (cm)</li>
                <li >Milimeters (mm)</li>
                <li >Pica (pc)</li>
                <li >Points (pt)</li>
            </ul>
        </header>
        <section>
            <h3 class="subtitle">Example:</h3>
            <ul>
                <li  class="absolute01">Inch: 0.4in</li>
                <li class="absolute02">Centimeters: 1cm</li>
                <li class="absolute03">Milimeters: 10mm</li>
                <li class="absolute04">Points: 10pt</li>
                <li class="absolute05">Pica: 1pc</li>
            </ul>
        </section>
    </main>
