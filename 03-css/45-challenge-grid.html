<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grid</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        div.gallery {
  display: grid;
  grid-template-columns: 100px 100px;
  grid-template-areas: " one two three   "
                       " four two five "
                       " six six seven ";
  grid-gap: 0.4rem;
  margin: 2rem 2rem 2rem 2rem;
  width: 300px;
  object-fit: cover;
  div {
    background-color: crimson;
    height: 100px;
    width: 100px;
    
    &:hover{
      transform: scale(1.1);
    }
    
    &:first-child {
      background: url(imgs/01_superior_izquierda.png) center/cover;
      grid-area: one;

    }
    &:nth-child(2) {
        background: url(imgs/02_superior_centro.png) center/cover;
      grid-area: two;
            height: calc(200px + 0.5rem);

      
    }
    &:nth-child(3) {
      grid-area: three;
      background: url(imgs/03_superior_derecha.png) center/cover;
    }
    &:nth-child(4) {
      background: url(imgs/04_centro_izquierda.png) center/cover ;
      grid-area: four;
    }
    &:nth-child(5) {
      grid-area: five;
      background:url(imgs/05_centro_derecha.png) center/cover ;
    }
    &:nth-child(6) {
      grid-area: six;
      background: url(imgs/06_inferior_izquierda.png) center/cover;
      width: calc(200px + 0.2rem);
    }
    &:last-child {
      grid-area: seven;
      background: url(imgs/07_inferior_derecha.png) center/cover;
    }
  }
}
div.gallery2   {
  display: grid;
  grid-template-columns: 75px 75px 75px 75px; 
  grid-template-rows: 75px 75px 75px;
  grid-template-areas: " one one two three   "
                       " one one four four "
                       " five six four four ";
  grid-gap: 0.4rem;
  margin: 2rem 2rem 2rem 2rem;
  width: 300px;
  object-fit: cover;
  
  div {
    background-color: crimson;
    height: 75px;
    width: 75px;
    
    &:hover{
      transform: scale(1.1);
    }
    
    &:first-child {
      background: url(imgs/01_superior_izquierdo.jpg) center/cover;
      grid-area: one;
      height: calc(148px + 0.5rem);
      width: calc(148px + 0.5rem);


    }
    &:nth-child(2) {
        background: url(imgs/02_superior_centro.jpg) center/cover;
      grid-area: two;

      
    }
    &:nth-child(3) {
      grid-area: three;
      background: url(imgs/03_superior_derecho.jpg) center/cover;
    }
    &:nth-child(4) {
      background: url(imgs/06_inferior_derecho.jpg) center/cover ;
      grid-area: four;
      height: calc(148px + 0.5rem);
      width: calc(148px + 0.5rem);
    }
    &:nth-child(5) {
      grid-area: five;
      background:url(imgs/05_inferior_centro.jpg) center/cover ;
    }
    
    &:last-child {
      grid-area: six;
      background: url(imgs/04_inferior_izquierdo.jpg) center/cover;
    }
  }
}

    </style>
</head>
